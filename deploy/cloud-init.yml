#cloud-config
# SaveItDL — cloud-init for Ubuntu 24.04 (Timeweb / any VPS)
# Paste this into the Cloud-init field when creating the server.
# After boot, SSH in and: nano /opt/saveitdl/.env (set your tokens)
# Then: systemctl start saveitdl

package_update: true
package_upgrade: true

packages:
  - python3
  - python3-pip
  - python3-venv
  - ffmpeg
  - git
  - curl

write_files:
  - path: /etc/systemd/system/saveitdl.service
    content: |
      [Unit]
      Description=SaveItDL Bot
      After=network.target

      [Service]
      Type=simple
      User=saveitdl
      WorkingDirectory=/opt/saveitdl/repo
      ExecStart=/opt/saveitdl/venv/bin/python main.py
      EnvironmentFile=/opt/saveitdl/.env
      Restart=always
      RestartSec=10
      Environment=PYTHONUNBUFFERED=1

      [Install]
      WantedBy=multi-user.target

  - path: /etc/logrotate.d/saveitdl
    content: |
      /var/log/saveitdl/*.log {
          daily
          rotate 14
          compress
          delaycompress
          missingok
          notifempty
          copytruncate
      }

  - path: /opt/saveitdl/.env
    permissions: '0600'
    content: |
      TELEGRAM_TOKEN=CHANGE_ME
      DISCORD_TOKEN=
      ADMIN_ID=0
      ENABLED_PLATFORMS=telegram
      TEMP_DIR=/opt/saveitdl/downloads
      MAX_WORKERS=4
      QUEUE_SIZE=100
      STATS_DB=/opt/saveitdl/stats.db
      # Uncomment after running deploy/install-bot-api.sh
      # BOT_API_URL=http://localhost:8081

  - path: /etc/cron.d/saveitdl
    content: |
      # Clean temp files older than 1 hour
      0 * * * * saveitdl find /opt/saveitdl/downloads -type f -mmin +60 -delete 2>/dev/null
      # Update yt-dlp weekly
      0 4 * * 1 saveitdl /opt/saveitdl/venv/bin/pip install -U yt-dlp >/dev/null 2>&1
      # Backup stats daily
      30 3 * * * saveitdl cp /opt/saveitdl/stats.db /opt/saveitdl/backups/stats-$(date +\%F).db 2>/dev/null

runcmd:
  - useradd -r -m -d /opt/saveitdl -s /bin/bash saveitdl
  - mkdir -p /opt/saveitdl/downloads /opt/saveitdl/backups /var/log/saveitdl
  - git clone https://github.com/BxdiS/SaveItDL.git /opt/saveitdl/repo
  - python3 -m venv /opt/saveitdl/venv
  - /opt/saveitdl/venv/bin/pip install --upgrade pip
  - /opt/saveitdl/venv/bin/pip install -r /opt/saveitdl/repo/requirements.txt
  - chown -R saveitdl:saveitdl /opt/saveitdl /var/log/saveitdl
  - systemctl daemon-reload
  - systemctl enable saveitdl
  - echo ">>> SaveItDL installed. Edit /opt/saveitdl/.env then run: systemctl start saveitdl"
